<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="Segoe UI, Inter, Arial, sans-serif"><rect width="1600" height="1000" fill="#F3F5F7"/><defs><pattern id="hc" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="#E7EBEF"/><line x1="0" y1="0" x2="0" y2="14" stroke="#9AA6B2" stroke-width="1.2"/></pattern></defs><text x="100.0" y="120.0" font-size="24" fill="#1E2630" font-weight="700" text-anchor="start" >Before · elements overlap</text><text x="100.0" y="150.0" font-size="15" fill="#5B6573" font-weight="400" text-anchor="start" >Slab and beam both own the shaded volume</text><rect x="100.0" y="260.0" width="640.0" height="60.0" rx="0" fill="url(#hc)" stroke="#1E2630" stroke-width="2.2" /><rect x="360.0" y="260.0" width="120.0" height="240.0" rx="0" fill="url(#hc)" stroke="#1E2630" stroke-width="2.2" /><rect x="360.0" y="260.0" width="120.0" height="60.0" rx="0" fill="#F06A5F" stroke="none" stroke-width="0" opacity=".35"/><line x1="360.0" y1="320.0" x2="480.0" y2="320.0" stroke="#D2453B" stroke-width="2.5" stroke-dasharray="6 4" /><text x="420.0" y="560.0" font-size="13" fill="#5B6573" font-weight="600" text-anchor="middle" font-family="Consolas, 'Cascadia Mono', monospace" >BEAM 300×600</text><text x="620.0" y="248.0" font-size="13" fill="#5B6573" font-weight="600" text-anchor="middle" font-family="Consolas, 'Cascadia Mono', monospace" >SLAB 200</text><rect x="100.0" y="640.0" width="640.0" height="180.0" rx="8" fill="#FFFFFF" stroke="#C5CDD6" stroke-width="1" /><text x="120.0" y="674.0" font-size="14" fill="#5B6573" font-weight="700" text-anchor="start" >Schedule extract</text><text x="120.0" y="716.0" font-size="16" fill="#1E2630" font-weight="400" text-anchor="start" >Slab concrete</text><text x="720.0" y="716.0" font-size="16" fill="#1E2630" font-weight="700" text-anchor="end" font-family="Consolas, 'Cascadia Mono', monospace" >12.40 m³</text><text x="120.0" y="752.0" font-size="16" fill="#1E2630" font-weight="400" text-anchor="start" >Beam concrete</text><text x="720.0" y="752.0" font-size="16" fill="#1E2630" font-weight="700" text-anchor="end" font-family="Consolas, 'Cascadia Mono', monospace" >4.32 m³</text><text x="120.0" y="788.0" font-size="16" fill="#1E2630" font-weight="400" text-anchor="start" >Double-counted</text><text x="720.0" y="788.0" font-size="16" fill="#D2453B" font-weight="700" text-anchor="end" font-family="Consolas, 'Cascadia Mono', monospace" >0.36 m³</text><text x="860.0" y="120.0" font-size="24" fill="#1E2630" font-weight="700" text-anchor="start" >After · AutoJoin</text><text x="860.0" y="150.0" font-size="15" fill="#5B6573" font-weight="400" text-anchor="start" >Revit cuts the beam by the slab, so the BOQ counts it once</text><path d="M860 260 H1500 V320 H1240 V500 H1120 V320 H860 Z" fill="url(#hc)" stroke="#1E2630" stroke-width="2.4" /><text x="1180.0" y="560.0" font-size="13" fill="#5B6573" font-weight="600" text-anchor="middle" font-family="Consolas, 'Cascadia Mono', monospace" >BEAM 300×600</text><text x="1380.0" y="248.0" font-size="13" fill="#5B6573" font-weight="600" text-anchor="middle" font-family="Consolas, 'Cascadia Mono', monospace" >SLAB 200</text><rect x="860.0" y="640.0" width="640.0" height="180.0" rx="8" fill="#FFFFFF" stroke="#C5CDD6" stroke-width="1" /><text x="880.0" y="674.0" font-size="14" fill="#5B6573" font-weight="700" text-anchor="start" >Schedule extract</text><text x="880.0" y="716.0" font-size="16" fill="#1E2630" font-weight="400" text-anchor="start" >Slab concrete</text><text x="1480.0" y="716.0" font-size="16" fill="#1E2630" font-weight="700" text-anchor="end" font-family="Consolas, 'Cascadia Mono', monospace" >12.04 m³</text><text x="880.0" y="752.0" font-size="16" fill="#1E2630" font-weight="400" text-anchor="start" >Beam concrete</text><text x="1480.0" y="752.0" font-size="16" fill="#1E2630" font-weight="700" text-anchor="end" font-family="Consolas, 'Cascadia Mono', monospace" >4.32 m³</text><text x="880.0" y="788.0" font-size="16" fill="#1E2630" font-weight="400" text-anchor="start" >Double-counted</text><text x="1480.0" y="788.0" font-size="16" fill="#1E7A46" font-weight="700" text-anchor="end" font-family="Consolas, 'Cascadia Mono', monospace" >0.00 m³</text><line x1="800.0" y1="90.0" x2="800.0" y2="900.0" stroke="#C5CDD6" stroke-width="2" /><text x="100.0" y="920.0" font-size="14" fill="#6B7280" font-weight="400" text-anchor="start" >Section values are illustrative. A typical floor has hundreds of slab–beam–column pairs to join by hand.</text><rect x="1440.0" y="30.0" width="112.4" height="28.0" rx="4" fill="#1C2128" stroke="none" stroke-width="1" /><text x="1447.0" y="49.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="start" letter-spacing="1">ILLUSTRATION</text></svg>