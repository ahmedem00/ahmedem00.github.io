<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="Segoe UI, Inter, Arial, sans-serif"><rect width="1600" height="1000" fill="#0E1319"/><text x="70.0" y="86.0" font-size="30" fill="#E9EDF2" font-weight="700" text-anchor="start" >PlotMax · from plot to feasibility in ten minutes</text><text x="70.0" y="120.0" font-size="17" fill="#AEB4BD" font-weight="400" text-anchor="start" >Zoning rules + unit mix + market prices → the best buildable scheme, before an architect is appointed.</text><rect x="1450.0" y="40.0" width="71.4" height="28.0" rx="4" fill="#F2B33D" stroke="none" stroke-width="1" /><text x="1457.0" y="59.0" font-size="13" fill="#0E1116" font-weight="700" text-anchor="start" letter-spacing="1">CONCEPT</text><rect x="70.0" y="150.0" width="470.0" height="640.0" rx="8" fill="#141B23" stroke="#2C3846" stroke-width="1" /><text x="92.0" y="184.0" font-size="13" fill="#7F8894" font-weight="700" text-anchor="start" letter-spacing="2">SITE · ZONING ENVELOPE</text><path d="M120 250 L480 220 L500 700 L140 730 Z" fill="#1A2633" stroke="#4FC3F7" stroke-width="2" /><path d="M170 300 L440 276 L455 650 L186 672 Z" fill="none" stroke="#F2B33D" stroke-width="1.6" stroke-dasharray="8 5"/><rect x="205.0" y="320.0" width="95.0" height="300.0" rx="0" fill="#2E7D6B" stroke="#4CC38A" stroke-width="1.5" /><rect x="330.0" y="310.0" width="95.0" height="300.0" rx="0" fill="#2E7D6B" stroke="#4CC38A" stroke-width="1.5" /><text x="310.0" y="760.0" font-size="14" fill="#E9EDF2" font-weight="600" text-anchor="middle" font-family="Consolas, 'Cascadia Mono', monospace" >Plot 4 200 m² · setbacks 6 / 4 / 4 m</text><text x="208.0" y="470.0" font-size="12" fill="#E9EDF2" font-weight="700" text-anchor="start" >BLOCK 1</text><text x="333.0" y="460.0" font-size="12" fill="#E9EDF2" font-weight="700" text-anchor="start" >BLOCK 2</text><rect x="570.0" y="150.0" width="440.0" height="640.0" rx="8" fill="#141B23" stroke="#2C3846" stroke-width="1" /><text x="592.0" y="184.0" font-size="13" fill="#7F8894" font-weight="700" text-anchor="start" letter-spacing="2">THREE OPTIONS, RANKED</text><rect x="592.0" y="210.0" width="396.0" height="160.0" rx="8" fill="#1E2732" stroke="#F2B33D" stroke-width="2" /><text x="614.0" y="252.0" font-size="20" fill="#E9EDF2" font-weight="700" text-anchor="start" >Option A</text><text x="614.0" y="284.0" font-size="15" fill="#AEB4BD" font-weight="400" text-anchor="start" >2 blocks · G+7</text><text x="614.0" y="314.0" font-size="15" fill="#AEB4BD" font-weight="400" text-anchor="start" >112 units</text><text x="966.0" y="260.0" font-size="34" fill="#4CC38A" font-weight="700" text-anchor="end" font-family="Consolas, 'Cascadia Mono', monospace" >31 %</text><text x="966.0" y="286.0" font-size="12" fill="#7F8894" font-weight="500" text-anchor="end" >margin</text><rect x="614.0" y="330.0" width="120.0" height="24.0" rx="12" fill="#F2B33D" stroke="none" stroke-width="1" /><text x="674.0" y="347.0" font-size="11" fill="#0E1319" font-weight="800" text-anchor="middle" >RECOMMENDED</text><rect x="592.0" y="390.0" width="396.0" height="160.0" rx="8" fill="#1E2732" stroke="#2C3846" stroke-width="1" /><text x="614.0" y="432.0" font-size="20" fill="#E9EDF2" font-weight="700" text-anchor="start" >Option B</text><text x="614.0" y="464.0" font-size="15" fill="#AEB4BD" font-weight="400" text-anchor="start" >L-block · G+9</text><text x="614.0" y="494.0" font-size="15" fill="#AEB4BD" font-weight="400" text-anchor="start" >118 units</text><text x="966.0" y="440.0" font-size="34" fill="#E9EDF2" font-weight="700" text-anchor="end" font-family="Consolas, 'Cascadia Mono', monospace" >27 %</text><text x="966.0" y="466.0" font-size="12" fill="#7F8894" font-weight="500" text-anchor="end" >margin</text><rect x="592.0" y="570.0" width="396.0" height="160.0" rx="8" fill="#1E2732" stroke="#2C3846" stroke-width="1" /><text x="614.0" y="612.0" font-size="20" fill="#E9EDF2" font-weight="700" text-anchor="start" >Option C<