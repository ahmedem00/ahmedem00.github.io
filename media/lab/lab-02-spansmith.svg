<circle cx="912.7" cy="464.0" r="8" fill="#F2B33D" stroke="#0E1319" stroke-width="2"/><circle cx="612.0" cy="632.0" r="14" fill="none" stroke="#4FC3F7" stroke-width="2.5"/><text x="632.0" y="616.0" font-size="14" fill="#4FC3F7" font-weight="700" text-anchor="start" >Chosen · 7.8 m · 18 fewer columns</text><text x="980.0" y="200.0" font-size="20" fill="#E9EDF2" font-weight="700" text-anchor="start" >How it works</text><text x="980.0" y="240.0" font-size="16" fill="#AEB4BD" font-weight="400" text-anchor="start" >Reads the architect&#x27;s plan: cores, façades,</text><text x="980.0" y="270.0" font-size="16" fill="#AEB4BD" font-weight="400" text-anchor="start" >parking bays and no-go zones.</text><text x="980.0" y="300.0" font-size="16" fill="#AEB4BD" font-weight="400" text-anchor="start" >Generates hundreds of grid layouts.</text><text x="980.0" y="330.0" font-size="16" fill="#AEB4BD" font-weight="400" text-anchor="start" >Pushes each to ETABS through the API,</text><text x="980.0" y="360.0" font-size="16" fill="#AEB4BD" font-weight="400" text-anchor="start" >sizes members and returns quantities.</text><text x="980.0" y="390.0" font-size="16" fill="#AEB4BD" font-weight="400" text-anchor="start" >Shows the cost-vs-span frontier so the</text><text x="980.0" y="420.0" font-size="16" fill="#AEB4BD" font-weight="400" text-anchor="start" >team picks a layout in the first meeting.</text><text x="980.0" y="500.0" font-size="20" fill="#E9EDF2" font-weight="700" text-anchor="start" >Builds on</text><text x="980.0" y="540.0" font-size="16" fill="#F2B33D" font-weight="400" text-anchor="start" >▸ Grid Generator (layout + dims)</text><text x="980.0" y="570.0" font-size="16" fill="#F2B33D" font-weight="400" text-anchor="start" >▸ BimScope (Revit ↔ ETABS sync)</text><text x="980.0" y="600.0" font-size="16" fill="#F2B33D" font-weight="400" text-anchor="start" >▸ ETABS / SAP2000 API</text><text x="70.0" y="900.0" font-size="14" fill="#7F8894" font-weight="400" text-anchor="start" >Illustrative data. Each dot is one generated layout. The amber line is the Pareto frontier.</text><rect x="1450.0" y="40.0" width="71.4" height="28.0" rx="4" fill="#F2B33D" stroke="none" stroke-width="1" /><text x="1457.0" y="59.0" font-size="13" fill="#0E1116" font-weight="700" text-anchor="start" letter-spacing="1">CONCEPT</text></svg>