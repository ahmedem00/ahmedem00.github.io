<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="Segoe UI, Inter, Arial, sans-serif"><rect width="1600" height="1000" fill="#F7F8F9"/><text x="80.0" y="100.0" font-size="34" fill="#0F1720" font-weight="700" text-anchor="start" >BimScope data flow</text><text x="80.0" y="138.0" font-size="18" fill="#4B5563" font-weight="400" text-anchor="start" >One analytical model, two programs, kept in sync both ways.</text><rect x="80.0" y="200.0" width="420.0" height="300.0" rx="10" fill="#FFFFFF" stroke="#C5CDD6" stroke-width="1.3" /><rect x="80.0" y="200.0" width="420.0" height="8.0" rx="4" fill="#1F6FB2" stroke="none" stroke-width="1" /><text x="100.0" y="240.0" font-size="19" fill="#0F1720" font-weight="700" text-anchor="start" >Revit</text><text x="100.0" y="272.0" font-size="15" fill="#4B5563" font-weight="400" text-anchor="start" >Physical + analytical model</text><text x="100.0" y="298.0" font-size="15" fill="#4B5563" font-weight="400" text-anchor="start" >Columns, beams, floors</text><text x="100.0" y="324.0" font-size="15" fill="#4B5563" font-weight="400" text-anchor="start" >Loads, combinations, supports</text><text x="100.0" y="350.0" font-size="15" fill="#4B5563" font-weight="400" text-anchor="start" >Colour-coded result views</text><rect x="1100.0" y="200.0" width="420.0" height="300.0" rx="10" fill="#FFFFFF" stroke="#C5CDD6" stroke-width="1.3" /><rect x="1100.0" y="200.0" width="420.0" height="8.0" rx="4" fill="#C2410C" stroke="none" stroke-width="1" /><text x="1120.0" y="240.0" font-size="19" fill="#0F1720" font-weight="700" text-anchor="start" >ETABS</text><text x="1120.0" y="272.0" font-size="15" fill="#4B5563" font-weight="400" text-anchor="start" >Frame &amp; shell objects</text><text x="1120.0" y="298.0" font-size="15" fill="#4B5563" font-weight="400" text-anchor="start" >Section + material definitions</text><text x="1120.0" y="324.0" font-size="15" fill="#4B5563" font-weight="400" text-anchor="start" >Load cases &amp; combos</text><text x="1120.0" y="350.0" font-size="15" fill="#4B5563" font-weight="400" text-anchor="start" >Analysis results</text><rect x="590.0" y="210.0" width="420.0" height="280.0" rx="10" fill="#0F1720" stroke="#0F1720" stroke-width="1.3" /><text x="610.0" y="250.0" font-size="19" fill="#FFFFFF" font-weight="700" text-anchor="start" >BimScope core</text><text x="610.0" y="282.0" font-size="15" fill="#C9CED6" font-weight="400" text-anchor="start" >Clean Architecture · MVVM</text><text x="610.0" y="308.0" font-size="15" fill="#C9CED6" font-weight="400" text-anchor="start" >Section &amp; material mapper</text><text x="610.0" y="334.0" font-size="15" fill="#C9CED6" font-weight="400" text-anchor="start" >Load / boundary editors</text><text x="610.0" y="360.0" font-size="15" fill="#C9CED6" font-weight="400" text-anchor="start" >Result reader + annotator</text><line x1="500.0" y1="300.0" x2="590.0" y2="300.0" stroke="#0F1720" stroke-width="2.2" /><path d="M590 300 L578.9 304.7 L578.9 295.3 Z" fill="#0F1720" stroke="none" stroke-width="1" /><text x="545.0" y="290.0" font-size="13" fill="#4B5563" font-weight="600" text-anchor="middle" font-family="Consolas, 'Cascadia Mono', monospace" >geometry</text><line x1="1010.0" y1="300.0" x2="1100.0" y2="300.0" stroke="#0F1720" stroke-width="2.2" /><path d="M1100 300 L1088.9 304.7 L1088.9 295.3 Z" fill="#0F1720" stroke="none" stroke-width="1" /><text x="1055.0" y="290.0" font-size="13" fill="#4B5563" font-weight="600" text-anchor="middle" font-family="Consolas, 'Cascadia Mono', monospace" >ETABS API</text><line x1="1100.0" y1="420.0" x2="1010.0" y2="420.0" stroke="#0F1720" stroke-width="2.2" /><path d="M1010 420 L1021.1 415.3 L1021.1 424.7 Z" fill="#0F1720" stroke="none" stroke-width="1" /><text x="1055.0" y="410.0" font-size="13" fill="#4B5563" font-weight="600" text-anchor="middle" font-family="Consolas, 'Cascadia Mono', monospace" >M · V · N</text><line x1="590.0" y1="420.0" x2="500.0" y2="420.0" stroke="#0F1720" stroke-width="2.2" /><path d="M500 420 L511.1 415.3 L511.1 424.7 Z" fill="#0F1720" stroke="none" stroke-width="1" /><text x="545.0" y="410.0" font-size="13" fill="#4B5563" font-weight="600" text-anchor="middle" font-family="Consolas, 'Cascadia Mono', monospace" >annotations</text><rect x="80.0" y="580.0" width="270.0" height="140.0" rx="10" fill="#FFFFFF" stroke="#C5CDD6" stroke-width="1.2" /><text x="100.0" y="620.0" font-size="22" fill="#1F6FB2" font-weight="700" text-anchor="start" font-family="Consolas, 'Cascadia Mono', monospace" >01</text><text x="100.0" y="656.0" font-size="16" fill="#0F1720" font-weight="600" text-anchor="start" >Model in Revit </text><rect x="376.0" y="580.0" width="270.0" height="140.0" rx="10" fill="#FFFFFF" stroke="#C5CDD6" stroke-width="1.2" /><text x="396.0" y="620.0" font-size="22" fill="#1F6FB2" font-weight="700" text-anchor="start" font-family="Consolas, 'Cascadia Mono', monospace" >02</text><text x="396.0" y="656.0" font-size="16" fill="#0F1720" font-weight="600" text-anchor="start" >Assign loads &amp; supports </text><text x="396.0" y="680.0" font-size="16" fill="#0F1720" font-weight="600" text-anchor="start" >in WPF dialogs </text><rect x="672.0" y="580.0" width="270.0" height="140.0" rx="10" fill="#FFFFFF" stroke="#C5CDD6" stroke-width="1.2" /><text x="692.0" y="620.0" font-size="22" fill="#1F6FB2" font-weight="700" text-anchor="start" font-family="Consolas, 'Cascadia Mono', monospace" >03</text><text x="692.0" y="656.0" font-size="16" fill="#0F1720" font-weight="600" text-anchor="start" >Push to ETABS and run </text><rect x="968.0" y="580.0" width="270.0" height="140.0" rx="10" fill="#FFFFFF" stroke="#C5CDD6" stroke-width="1.2" /><text x="988.0" y="620.0" font-size="22" fill="#1F6FB2" font-weight="700" text-anchor="start" font-family="Consolas, 'Cascadia Mono', monospace" >04</text><text x="988.0" y="656.0" font-size="16" fill="#0F1720" font-weight="600" text-anchor="start" >Pull moments, shears and </text><text x="988.0" y="680.0" font-size="16" fill="#0F1720" font-weight="600" text-anchor="start" >axial forces </text><rect x="1264.0" y="580.0" width="270.0" height="140.0" rx="10" fill="#FFFFFF" stroke="#C5CDD6" stroke-width="1.2" /><text x="1284.0" y="620.0" font-size="22" fill="#1F6FB2" font-weight="700" text-anchor="start" font-family="Consolas, 'Cascadia Mono', monospace" >05</text><text x="1284.0" y="656.0" font-size="16" fill="#0F1720" font-weight="600" text-anchor="start" >Draw diagrams + values </text><text x="1284.0" y="680.0" font-size="16" fill="#0F1720" font-weight="600" text-anchor="start" >in Revit 3D </text><text x="80.0" y="800.0" font-size="17" fill="#4B5563" font-weight="400" text-anchor="start" >Engineers stay in Revit. ETABS runs in the background through its API, and results land back as annotated 3D views.</text></svg>