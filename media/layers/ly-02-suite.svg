<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="Segoe UI, Inter, Arial, sans-serif"><rect width="1600" height="1000" fill="#14181E"/><text x="80.0" y="110.0" font-size="36" fill="#E9EDF2" font-weight="700" text-anchor="start" >CG Tools for AutoCAD</text><text x="80.0" y="150.0" font-size="18" fill="#9AA4AF" font-weight="400" text-anchor="start" >One ribbon tab, four modules, one installer for AutoCAD 2023 – 2026.</text><rect x="80.0" y="220.0" width="344.0" height="420.0" rx="10" fill="#1F252D" stroke="#39414C" stroke-width="1" /><rect x="104.0" y="248.0" width="56.0" height="56.0" rx="10" fill="#3A2F12" stroke="none" stroke-width="1" /><path d="M114 268 L132 260 L150 268 L132 276 Z" fill="#D9A21B" stroke="#D9A21B" stroke-width="1.6" /><path d="M114 277 L132 269 L150 277 L132 285 Z" fill="none" stroke="#D9A21B" stroke-width="1.6" /><path d="M114 286 L132 278 L150 286 L132 294 Z" fill="none" stroke="#D9A21B" stroke-width="1.6" /><text x="104.0" y="346.0" font-size="24" fill="#E9EDF2" font-weight="700" text-anchor="start" >Layer Generator</text><text x="104.0" y="378.0" font-size="15" fill="#D9A21B" font-weight="600" text-anchor="start" font-family="Consolas, 'Cascadia Mono', monospace" >Excel → layers</text><text x="104.0" y="420.0" font-size="15" fill="#AEB4BD" font-weight="400" text-anchor="start" >Creates the company layer set </text><text x="104.0" y="444.0" font-size="15" fill="#AEB4BD" font-weight="400" text-anchor="start" >(name, colour, linetype, </text><text x="104.0" y="468.0" font-size="15" fill="#AEB4BD" font-weight="400" text-anchor="start" >description) in batches of DWGs. </text><rect x="448.0" y="220.0" width="344.0" height="420.0" rx="10" fill="#1F252D" stroke="#39414C" stroke-width="1" /><rect x="472.0" y="248.0" width="56.0" height="56.0" rx="10" fill="#3A2F12" stroke="none" stroke-width="1" /><path d="M482 268 L500 260 L518 268 L500 276 Z" fill="#D9A21B" stroke="#D9A21B" stroke-width="1.6" /><path d="M482 277 L500 269 L518 277 L500 285 Z" fill="none" stroke="#D9A21B" stroke-width="1.6" /><path d="M482 286 L500 278 L518 286 L500 294 Z" fill="none" stroke="#D9A21B" stroke-width="1.6" /><text x="472.0" y="346.0" font-size="24" fill="#E9EDF2" font-weight="700" text-anchor="start" >Layers Merger</text><text x="472.0" y="378.0" font-size="15" fill="#D9A21B" font-weight="600" text-anchor="start" font-family="Consolas, 'Cascadia Mono', monospace" >N layers → 1</text><text x="472.0" y="420.0" font-size="15" fill="#AEB4BD" font-weight="400" text-anchor="start" >Moves every entity from selected </text><text x="472.0" y="444.0" font-size="15" fill="#AEB4BD" font-weight="400" text-anchor="start" >layers into one target and purges </text><text x="472.0" y="468.0" font-size="15" fill="#AEB4BD" font-weight="400" text-anchor="start" >the leftovers. Prefix exclusions </text><text x="472.0" y="492.0" font-size="15" fill="#AEB4BD" font-weight="400" text-anchor="start" >protect disciplines. </text><rect x="816.0" y="220.0" width="344.0" height="420.0" rx="10" fill="#1F252D" stroke="#39414C" stroke-width="1" /><rect x="840.0" y="248.0" width="56.0" height="56.0" rx="10" fill="#3A2F12" stroke="none" stroke-width="1" /><path d="M850 268 L868 260 L886 268 L868 276 Z" fill="#D9A21B" stroke="#D9A21B" stroke-width="1.6" /><path d="M850 277 L868 269 L886 277 L868 285 Z" fill="none" stroke="#D9A21B" stroke-width="1.6" /><path d="M850 286 L868 278 L886 286 L868 294 Z" fill="none" stroke="#D9A21B" stroke-width="1.6" /><text x="840.0" y="346.0" font-size="24" fill="#E9EDF2" font-weight="700" text-anchor="start" >Layer Fixer</text><text x="840.0" y="378.0" font-size="15" fill="#D9A21B" font-weight="600" text-anchor="start" font-family="Consolas, 'Cascadia Mono', monospace" >Blocks → right layer</text><text x="840.0" y="420.0" font-size="15" fill="#AEB4BD" font-weight="400" text-anchor="start" >Reads an abbreviation map and </text><text x="840.0" y="444.0" font-size="15" fill="#AEB4BD" font-weight="400" text-anchor="start" >moves matching blocks to the </text><text x="840.0" y="468.0" font-size="15" fill="#AEB4BD" font-weight="400" text-anchor="start" >standard layer with the right ACI </text><text x="840.0" y="492.0" font-size="15" fill="#AEB4BD" font-weight="400" text-anchor="start" >colour. </text><rect x="1184.0" y="220.0" width="344.0" height="420.0" rx="10" fill="#1F252D" stroke="#39414C" stroke-width="1" /><rect x="1208.0" y="248.0" width="56.0" height="56.0" rx="10" fill="#3A2F12" stroke="none" stroke-width="1" /><path d="M1218 268 L1236 260 L1254 268 L1236 276 Z" fill="#D9A21B" stroke="#D9A21B" stroke-width="1.6" /><path d="M1218 277 L1236 269 L1254 277 L1236 285 Z" fill="none" stroke="#D9A21B" stroke-width="1.6" /><path d="M1218 286 L1236 278 L1254 286 L1236 294 Z" fill="none" stroke="#D9A21B" stroke-width="1.6" /><text x="1208.0" y="346.0" font-size="24" fill="#E9EDF2" font-weight="700" text-anchor="start" >Raster Embedder</text><text x="1208.0" y="378.0" font-size="15" fill="#D9A21B" font-weight="600" text-anchor="start" font-family="Consolas, 'Cascadia Mono', monospace" >Links → OLE</text><text x="1208.0" y="420.0" font-size="15" fill="#AEB4BD" font-weight="400" text-anchor="start" >Turns linked title-block images </text><text x="1208.0" y="444.0" font-size="15" fill="#AEB4BD" font-weight="400" text-anchor="start" >into embedded objects so sheets </text><text x="1208.0" y="468.0" font-size="15" fill="#AEB4BD" font-weight="400" text-anchor="start" >never open with missing-image </text><text x="1208.0" y="492.0" font-size="15" fill="#AEB4BD" font-weight="400" text-anchor="start" >frames. </text><text x="80.0" y="720.0" font-size="13" fill="#7F8894" font-weight="700" text-anchor="start" letter-spacing="2">PLUGIN HOST</text><text x="80.0" y="752.0" font-size="19" fill="#E9EDF2" font-weight="500" text-anchor="start" >IExtensionApplication · DI via Microsoft.Extensions.Hosting</text><text x="816.0" y="720.0" font-size="13" fill="#7F8894" font-weight="700" text-anchor="start" letter-spacing="2">UI</text><text x="816.0" y="752.0" font-size="19" fill="#E9EDF2" font-weight="500" text-anchor="start" >WPF · MVVM · 3-step wizard · light/dark</text><text x="80.0" y="816.0" font-size="13" fill="#7F8894" font-weight="700" text-anchor="start" letter-spacing="2">OPS</text><text x="80.0" y="848.0" font-size="19" fill="#E9EDF2" font-weight="500" text-anchor="start" >Usage reporting · version gating · obfuscation</text><text x="816.0" y="816.0" font-size="13" fill="#7F8894" font-weight="700" text-anchor="start" letter-spacing="2">DELIVERY</text><text x="816.0" y="848.0" font-size="19" fill="#E9EDF2" font-weight="500" text-anchor="start" >WixSharp MSI · PackageContents bundle · 2023–2026</text></svg>