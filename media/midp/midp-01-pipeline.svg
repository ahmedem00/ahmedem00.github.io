<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="Segoe UI, Inter, Arial, sans-serif"><rect width="1600" height="1000" fill="#F7F8F9"/><text x="80.0" y="100.0" font-size="34" fill="#0F1720" font-weight="700" text-anchor="start" >MIDP Validator pipeline</text><text x="80.0" y="138.0" font-size="18" fill="#4B5563" font-weight="400" text-anchor="start" >Catches the invisible errors that break CDE uploads and transmittals before anyone notices them.</text><rect x="80.0" y="200.0" width="340.0" height="250.0" rx="10" fill="#FFFFFF" stroke="#C5CDD6" stroke-width="1.3" /><rect x="80.0" y="200.0" width="340.0" height="8.0" rx="4" fill="#1F6FB2" stroke="none" stroke-width="1" /><text x="100.0" y="240.0" font-size="19" fill="#0F1720" font-weight="700" text-anchor="start" >MIDP workbook</text><text x="100.0" y="272.0" font-size="15" fill="#4B5563" font-weight="400" text-anchor="start" >Selected sheets</text><text x="100.0" y="298.0" font-size="15" fill="#4B5563" font-weight="400" text-anchor="start" >Doc-number column F</text><text x="100.0" y="324.0" font-size="15" fill="#4B5563" font-weight="400" text-anchor="start" >Title column (any letter)</text><text x="100.0" y="350.0" font-size="15" fill="#4B5563" font-weight="400" text-anchor="start" >Header row offset</text><rect x="520.0" y="200.0" width="560.0" height="520.0" rx="10" fill="#0F1720" stroke="#0F1720" stroke-width="1.3" /><text x="540.0" y="240.0" font-size="19" fill="#FFFFFF" font-weight="700" text-anchor="start" >23 rules · 4 severities</text><text x="548.0" y="290.0" font-size="17" fill="#F2B33D" font-weight="700" text-anchor="start" >Whitespace</text><text x="548.0" y="318.0" font-size="15" fill="#C9CED6" font-weight="400" text-anchor="start" font-family="Consolas, 'Cascadia Mono', monospace" >leading · trailing · double · NBSP · tab</text><text x="548.0" y="374.0" font-size="17" fill="#F2B33D" font-weight="700" text-anchor="start" >Hidden text</text><text x="548.0" y="402.0" font-size="15" fill="#C9CED6" font-weight="400" text-anchor="start" font-family="Consolas, 'Cascadia Mono', monospace" >invisible Unicode · line breaks · smart quotes</text><text x="548.0" y="458.0" font-size="17" fill="#F2B33D" font-weight="700" text-anchor="start" >Excel traps</text><text x="548.0" y="486.0" font-size="15" fill="#C9CED6" font-weight="400" text-anchor="start" font-family="Consolas, 'Cascadia Mono', monospace" >formulas · merged · hidden rows · number→date · 1E+05</text><text x="548.0" y="542.0" font-size="17" fill="#F2B33D" font-weight="700" text-anchor="start" >Numbering</text><text x="548.0" y="570.0" font-size="15" fill="#C9CED6" font-weight="400" text-anchor="start" font-family="Consolas, 'Cascadia Mono', monospace" >duplicate doc no. · blank / skipped revision</text><text x="548.0" y="626.0" font-size="17" fill="#F2B33D" font-weight="700" text-anchor="start" >Titles</text><text x="548.0" y="654.0" font-size="15" fill="#C9CED6" font-weight="400" text-anchor="start" font-family="Consolas, 'Cascadia Mono', monospace" >case · &amp; · mixed Arabic/English · no. in title</text><rect x="1180.0" y="200.0" width="340.0" height="150.0" rx="10" fill="#FFFFFF" stroke="#C5CDD6" stroke-width="1.3" /><rect x="1180.0" y="200.0" width="340.0" height="8.0" rx="4" fill="#009A8E" stroke="none" stroke-width="1" /><text x="1200.0" y="240.0" font-size="19" fill="#0F1720" font-weight="700" text-anchor="start" >Highlighted Excel</text><text x="1200.0" y="272.0" font-size="15" fill="#4B5563" font-weight="400" text-anchor="start" >every issue coloured by severity</text><line x1="1080.0" y1="460.0" x2="1180.0" y2="275.0" stroke="#0F1720" stroke-width="2.2" /><path d="M1180 275 L1178.9 286.9 L1170.6 282.5 Z" fill="#0F1720" stroke="none" stroke-width="1" /><rect x="1180.0" y="380.0" width="340.0" height="150.0" rx="10" fill="#FFFFFF" stroke="#C5CDD6" stroke-width="1.3" /><rect x="1180.0" y="380.0" width="340.0" height="8.0" rx="4" fill="#009A8E" stroke="none" stroke-width="1" /><text x="1200.0" y="420.0" font-size="19" fill="#0F1720" font-weight="700" text-anchor="start" >Cleaned copy</text><text x="1200.0" y="452.0" font-size="15" fill="#4B5563" font-weight="400" text-anchor="start" >invisible characters stripped</text><line x1="1080.0" y1="460.0" x2="1180.0" y2="455.0" stroke="#0F1720" stroke-width="2.2" /><path d="M1180 455 L1169.2 460.2 L1168.7 450.9 Z" fill="#0F1720" stroke="none" stroke-width="1" /><rect x="1180.0" y="560.0" width="340.0" height="150.0" rx="10" fill="#FFFFFF" stroke="#C5CDD6" stroke-width="1.3" /><rect x="1180.0" y="560.0" width="340.0" height="8.0" rx="4" fill="#009A8E" stroke="none" stroke-width="1" /><text x="1200.0" y="600.0" font-size="19" fill="#0F1720" font-weight="700" text-anchor="start" >Renamed PDFs &amp; DWGs</text><text x="1200.0" y="632.0" font-size="15" fill="#4B5563" font-weight="400" text-anchor="start" >filenames match the MIDP</text><line x1="1080.0" y1="460.0" x2="1180.0" y2="635.0" stroke="#0F1720" stroke-width="2.2" /><path d="M1180 635 L1170.5 627.7 L1178.6 623.1 Z" fill="#0F1720" stroke="none" stroke-width="1" /><line x1="420.0" y1="325.0" x2="520.0" y2="325.0" stroke="#0F1720" stroke-width="2.2" /><path d="M520 325 L508.9 329.7 L508.9 320.3 Z" fill="#0F1720" stroke="none" stroke-width="1" /><text x="80.0" y="840.0" font-size="44" fill="#0F1720" font-weight="700" text-anchor="start" font-family="Consolas, 'Cascadia Mono', monospace" >1 019</text><text x="80.0" y="876.0" font-size="16" fill="#4B5563" font-weight="400" text-anchor="start" >cells checked</text><text x="452.0" y="840.0" font-size="44" fill="#0F1720" font-weight="700" text-anchor="start" font-family="Consolas, 'Cascadia Mono', monospace" >684</text><text x="452.0" y="876.0" font-size="16" fill="#4B5563" font-weight="400" text-anchor="start" >errors</text><text x="824.0" y="840.0" font-size="44" fill="#0F1720" font-weight="700" text-anchor="start" font-family="Consolas, 'Cascadia Mono', monospace" >309</text><text x="824.0" y="876.0" font-size="16" fill="#4B5563" font-weight="400" text-anchor="start" >warnings</text><text x="1196.0" y="840.0" font-size="44" fill="#0F1720" font-weight="700" text-anchor="start" font-family="Consolas, 'Cascadia Mono', monospace" >≈ 6 h</text><text x="1196.0" y="876.0" font-size="16" fill="#4B5563" font-weight="400" text-anchor="start" >saved per user / project</text><text x="80.0" y="930.0" font-size="14" fill="#6B7280" font-weight="400" text-anchor="start" >Figures from one real validation run (MMR2 sheet) shown in the screenshots.</text></svg>